<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17141f" />
    <meta name="description" content="在 20 秒内，为 NPC 的心事命名。" />
    <title>情绪捕手 · 20 秒心事辨认</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="screen start-screen" aria-labelledby="game-title">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="eyebrow">EMOTION CATCHER · 01</div>
        <p class="kicker">20 秒，给一个说不出口的心事命名</p>
        <h1 id="game-title">情绪捕手</h1>
        <p class="intro">NPC「零」会告诉你一段短短的心事。<br />请用一个最贴切的感受词，接住它。</p>
        <div class="rule-card">
          <span class="rule-number">20</span>
          <span>秒内作答<br /><small>答错或超时都会揭晓答案</small></span>
        </div>
        <button id="start-button" class="primary-button" type="button">开始这一局 <span>→</span></button>
        <p class="subtle">10 题一局 · 没有标准的人生，只有更准确的表达</p>
      </section>

      <section id="game-screen" class="screen game-screen is-hidden" aria-live="polite">
        <header class="game-header">
          <button id="quit-button" class="text-button" type="button">结束本局</button>
          <div class="progress-label"><span id="question-current">01</span> / <span id="question-total">10</span></div>
        </header>

        <div class="progress-track" aria-label="答题进度"><div id="progress-bar" class="progress-bar"></div></div>

        <section class="npc-card">
          <div class="npc-intro">
            <div class="npc-avatar" aria-hidden="true">零</div>
            <div><p class="npc-name">NPC · 零</p><p id="npc-status" class="npc-status">正在回想一件事</p></div>
            <div id="timer-ring" class="timer-ring" aria-label="剩余 20 秒"><span id="timer-number">20</span></div>
          </div>
          <blockquote id="scene-text" class="scene-text"></blockquote>
        </section>

        <section class="answer-area" aria-label="输入感受词">
          <label for="answer-input">此刻，零更像是……</label>
          <div class="answer-row">
            <input id="answer-input" type="text" inputmode="text" maxlength="12" autocomplete="off" placeholder="输入一个感受词" />
            <button id="submit-button" class="submit-button" type="button">判断</button>
          </div>
          <p id="input-hint" class="input-hint">例如：委屈、释然、窘迫、忐忑</p>
        </section>

        <div id="feedback-layer" class="feedback-layer is-hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
          <article id="feedback-card" class="feedback-card">
            <div id="feedback-icon" class="feedback-icon">✓</div>
            <p id="feedback-result" class="feedback-result">你接住了这份心事</p>
            <h2 id="feedback-title">准确答案：<span id="correct-answer"></span></h2>
            <p id="feedback-copy" class="feedback-copy"></p>
            <div class="feedback-bottom"><span id="score-change"></span><span id="next-countdown">3 秒后下一题</span></div>
          </article>
        </div>
      </section>

      <section id="result-screen" class="screen result-screen is-hidden" aria-labelledby="result-title">
        <div class="eyebrow">一局结束</div>
        <p class="kicker">你已经为十个难以言说的瞬间找过名字</p>
        <h1 id="result-title">这一次，你接住了<br /><span id="correct-count">0</span> 份心事</h1>
        <div class="result-grid">
          <div><span id="final-score">0</span><small>总分</small></div>
          <div><span id="best-streak">0</span><small>最长连胜</small></div>
          <div><span id="near-count">0</span><small>差一点答中</small></div>
        </div>
        <div id="reflection-card" class="reflection-card"></div>
        <button id="restart-button" class="primary-button" type="button">再接一局 <span>↻</span></button>
        <button id="home-button" class="text-button home-button" type="button">回到首页</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
